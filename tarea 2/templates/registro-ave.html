<!DOCTYPE html>
<html lang="es">
<head>
<title>Registro de avistamiento de aves</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">
/* Estilo general de la página */
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #eaf7f2;
  color: #1f333d;
  margin: 0;
  padding: 30px;
}

/* Título */
h1 {
  text-align: center;
  color: #2c5598;
  margin-bottom: 25px;
}

/* Tarjeta del formulario */
form {
  width: 400px;
  max-width: 90%;
  margin: 0 auto;
  background-color: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

/* Texto de cada campo */
label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
  color: #263238;
}

/* Inputs y select */
input,
select {
  width: 100%;
  padding: 10px;
  border: 2px solid #b8d8cc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

/* Cuando el usuario selecciona un campo */
input:focus,
select:focus {
  border-color: #1f4579;
  outline: none;
  box-shadow: 0 0 5px rgba(38, 108, 166, 0.4);
}
.mensaje-error {
  color: #c62828;
  font-size: 14px;
  margin-top: 4px;
  margin-bottom: 10px;
}

/* Botón */
button {
  width: 100%;
  margin-top: 25px;
  padding: 12px;

  background-color: #1f4579;
  color: #f3f7f9;

  border: none;
  border-radius: 8px;

  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

/* Cuando el mouse pasa por el botón */
button:hover {
  background-color: #0f8eb5;
}
</style>
</head> 
<body>

<header>


    <nav>
      <a href="{{ url_for('intermedio') }}">← Volver al menú</a>
    </nav>

  </header>

<main>

  <h1>Registro de avistamiento</h1>

  <form
    id="formAvistamiento"
    action="{{ url_for('registrar_avistamiento') }}"
    method="POST"
    enctype="multipart/form-data"
  >

    <p>(*) Campos obligatorios</p>

    {% if error %}
      <p class="mensaje-error">{{ error }}</p>
    {% endif %}


    <!-- INFORMACIÓN DEL AVE -->

    <fieldset>

      <legend>Información del ave</legend>

      <label for="ave">Tipo de ave (*):</label>

      <select id="ave" name="ave">
        <option value="">Seleccione un ave</option>

        {% for ave in aves %}
          <option value="{{ ave.id }}">
            {{ ave.nombre }}
          </option>
        {% endfor %}

      </select>

      <p id="error_tipo" class="mensaje-error"></p>

    </fieldset>


    <br><br>


    <!-- INFORMACIÓN DEL AVISTAMIENTO -->

    <fieldset>

      <legend>Información del avistamiento</legend>

      <label for="region">Región (*):</label>

      <select id="region" name="region">
        <option value="">Seleccione una región</option>

        {% for region in regiones %}
          <option value="{{ region.id }}">
            {{ region.nombre }}
          </option>
        {% endfor %}
      </select>

      <p id="error_region" class="mensaje-error"></p>


      <label for="comuna">Comuna (*):</label>

      <select id="comuna" name="comuna">
        <option value="">Seleccione una comuna</option>

        {% for comuna in comunas %}
          <option
            value="{{ comuna.id }}"
            data-region="{{ comuna.region_id }}"
          >
            {{ comuna.nombre }}
          </option>
        {% endfor %}
      </select>

      <p id="error_comuna" class="mensaje-error"></p>

      <label for="lugar">Lugar (*):</label>

      <input
        type="text"
        id="lugar"
        name="lugar"
        placeholder="Ej: Parque Mahuida"
      >

      <p id="error_lugar" class="mensaje-error"></p>


      <label for="fecha">Fecha del avistamiento (*):</label>

      <input
        type="date"
        id="fecha"
        name="fecha"
      >

      <p id="error_fecha" class="mensaje-error"></p>


      <label for="hora">Hora del avistamiento (*):</label>

      <input
        type="time"
        id="hora"
        name="hora"
      >

      <p id="error_hora" class="mensaje-error"></p>


      <label for="comentarios">
        Comentarios adicionales:
      </label>

      <textarea
        id="comentarios"
        name="comentarios"
        maxlength="500"
      ></textarea>

      <p id="error_comentarios" class="mensaje-error"></p>

    </fieldset>


    <br><br>


    <!-- REGISTRO AUDIOVISUAL -->

    <fieldset>

      <legend>Registro audiovisual</legend>

      <label for="archivo">
        Foto o video del avistamiento (*):
      </label>

      <input
        type="file"
        id="archivo"
        name="archivo"
        accept="image/*,video/*"
        multiple
      >

      <p id="error_archivo" class="mensaje-error"></p>

    </fieldset>


    <button type="submit">
      Registrar avistamiento
    </button>

  </form>

</main>


<script
  src="{{ url_for('static', filename='js/registro-avistamiento.js') }}">
</script>

</body>
</html>
