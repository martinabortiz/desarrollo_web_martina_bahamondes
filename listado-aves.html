<!DOCTYPE html>
<html lang="es">
<head>
<title>Registro de avistamiento de aves</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">

body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #eaf7f2;
  color: #263238;
  margin: 0;
  padding: 30px;
}

.imagen-avistamiento,
.video-avistamiento {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 15px;
}

/* Título */
h1 {
  text-align: center;
  color: #2e7d32;
  margin-bottom: 25px;
}

/* Tarjeta del formulario */
form {
  width: 400px;
  max-width: 90%;
  margin: 0 auto;
  background-color: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

/* Texto de cada campo */
label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
  color: #356859;
}

/* Inputs y select */
input,
select {
  width: 100%;
  padding: 10px;
  border: 2px solid #b8d8cc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

/* Cuando el usuario selecciona un campo */
input:focus,
select:focus {
  border-color: #26a69a;
  outline: none;
  box-shadow: 0 0 5px rgba(38, 166, 154, 0.4);
}


/* Botón */
button {
  width: 100%;
  margin-top: 25px;
  padding: 12px;

  background-color: #ff854d;
  color: #263238;

  border: none;
  border-radius: 8px;

  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#paginacion {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 30px 0;
}

#paginacion button {
  width: auto;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background-color: #d9e8e2;
  cursor: pointer;
  font-size: 16px;
}

#paginacion button:hover {
  background-color: #bdd6cd;
}

#paginacion button:disabled {
  background-color: #82c2ab;
  color: white;
  cursor: default;
}


</style>
<title>Avistamientos registrados</title>

</head>

<body>

  <header>

    <nav>
      <a href="intermedio.html">← Volver al menú</a>
    </nav>

  </header>


  <main>

    <h1> Avistamientos registrados</h1>

    <p class="descripcion">
      Consulta los avistamientos reportados por voluntarios.
    </p>
    <!-- FILTROS -->

    <section class="filtros">

      <h2>Buscar avistamientos</h2>


      <label for="filtro_tipo">
        Tipo de ave:
      </label>

      <label for="filtro_tipo">Tipo de ave:</label>

      <select id="filtro_tipo">

        <option value="todos" selected>
          Todos
        </option>

        <option value="rapaz_diurna">
          Rapaz diurna
        </option>

        <option value="rapaz_nocturna">
          Rapaz nocturna
        </option>

        <option value="carronera">
          Carroñera
        </option>

        <option value="acuatica">
          Acuática
        </option>

        <option value="marina">
          Marina
        </option>

        <option value="pinguino">
          Pingüino
        </option>

        <option value="paseriforme">
          Ave cantora / paseriforme
        </option>

        <option value="picaflor">
          Picaflor
        </option>

        <option value="carpintero">
          Carpintero
        </option>

        <option value="loro">
          Loro / cotorra
        </option>

        <option value="perdiz">
          Ave terrestre / no voladora
        </option>

        <option value="nandu">
          Ñandú
        </option>

        <option value="otra">
          Otra / No sé identificar
        </option>

</select>


      <label for="orden">
        Ordenar por:
      </label>

      <select id="orden">

        <option value="fecha_desc" selected>
          Fecha más reciente
        </option>

        <option value="fecha_asc">
          Fecha más antigua
        </option>

        <option value="lugar_asc">
          Lugar A-Z
        </option>

        <option value="lugar_desc">
          Lugar Z-A
        </option>

      </select>

    </section>


    <!-- LISTADO -->

    <section>

      <h2>Resultados</h2>

      <section id="lista-avistamientos">
        <!-- JavaScript agregará aquí los avistamientos -->
      </section>

    </section>


    <!-- PAGINACIÓN -->

    <nav id="paginacion" aria-label="Paginación de avistamientos">
      <!-- JavaScript agregará los botones -->
    </nav>

  </main>


  <script src="listado.js"></script>

  <script src="datos.js"></script>


</body></html>
