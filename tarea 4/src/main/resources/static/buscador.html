
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de aves</title>
    <script src="/js/buscador.js" defer></script>
</head>
<body>
    <main>
        <h1>Buscador de avistamientos</h1>

        <form id="form-busqueda" role="search">
            <label for="texto-busqueda">
                Buscar por ave, voluntario o comuna:
            </label>
            <input
                type="text"
                id="texto-busqueda"
                name="texto"
                placeholder="Escribe para buscar..."
                autocomplete="off"
            >
        </form>

        <p id="mensaje" role="status"></p>
        <ul id="resultados"></ul>
    </main>
</body>
</html>
