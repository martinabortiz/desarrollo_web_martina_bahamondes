<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Avistamientos de Aves de Chile</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #eaf7f2;
      color: #1f333d;
    }

    /* Imagen de portada */
    .imagen-portada {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    /* Contenido principal */
    main {
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #2c9832;
      font-size: 36px;
      margin-bottom: 15px;
    }

    .descripcion {
      max-width: 650px;
      margin: 0 auto 30px auto;
      font-size: 18px;
      line-height: 1.6;
      color: #285364;
    }

    /* Botón de registro */
    .boton-registro {
      display: inline-block;
      padding: 14px 30px;

      background-color: #ff7f4d;
      color: #263238;

      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 8px;

      transition: background-color 0.2s;
    }

    .boton-registro:hover {
      background-color: #ff7f4d;
    }

  </style>

</head>


<body>

  <header>

    <img
      src="foto1.JPG"
      alt="Aves de Chile en su hábitat natural"
      class="imagen-portada"
    >

  </header>


  <main>

    <h1> Avistamientos de Aves de Chile</h1>

    <p class="descripcion">
      Una plataforma colaborativa para registrar avistamientos de aves
      a lo largo de Chile. Ayúdanos a conocer mejor nuestra biodiversidad
      y a observar cómo cambian las poblaciones de aves en nuestro país.
    </p>
    <br><br> 
    <a href="registro.html" class="boton-registro">
      Registrarme como voluntario
    </a>

    <a href="listado-aves.html" class="boton-registro">

    </a>

    <a href="estadisticas.html" class="boton-registro">
      Ver estadísticas
    </a> -->

  </main>

</body>

</html>
