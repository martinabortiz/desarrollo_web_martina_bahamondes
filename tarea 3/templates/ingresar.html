<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar</title>
</head>
<style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #d1e4e7;
      color: #1f333d;
    }

    /* Imagen de portada */
    .imagen-portada {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    /* Contenido principal */
    main {
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #2c5598;
      font-size: 36px;
      margin-bottom: 15px;
    }

    .descripcion {
      max-width: 650px;
      margin: 0 auto 30px auto;
      font-size: 18px;
      line-height: 1.6;
      color: #263238;
    }

    /* Botón de registro */
    .button {
      display: inline-block;
      padding: 14px 30px;

      background-color: #1f4579;
      color: #f3f7f9;

      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 8px;

      transition: background-color 0.2s;
    }

    .button:hover {
      background-color: #0f8eb5;
    }

    .mensaje-exito {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;

      background-color: #d3ebeb;
      border: 1px solid #74b4be;

      font-weight: bold;
      text-align: center;
    }
</style>
<body>


    <header>


        <nav>
        <a href="{{ url_for('index') }}">← Volver al inicio</a>
        </nav>

    </header>

    <h1>Ingresar</h1>

    <form method="POST" action="{{ url_for('ingresar') }}">

        <label for="email">Correo electrónico:</label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <button type="submit">
            Ingresar
        </button>
        
        {% if error %}
            <p>{{ error }}</p>
        {% endif %}
        
        

    </form>

</body>
</html>
