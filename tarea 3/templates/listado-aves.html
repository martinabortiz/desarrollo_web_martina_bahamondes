<!DOCTYPE html>
<html lang="es">
<head>
<title>Registro de avistamiento de aves</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">

body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #eaf7f2;
  color: #263238;
  margin: 0;
  padding: 30px;
}

.imagen-avistamiento,
.video-avistamiento {
  width: 50%;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 15px;
}

/* Título */
h1 {
  text-align: center;
  color: #2c5598;
  margin-bottom: 25px;
}

/* Tarjeta del formulario */
form {
  width: 400px;
  max-width: 90%;
  margin: 0 auto;
  background-color: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

/* Texto de cada campo */
label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
  color: #2c6998;
}

/* Inputs y select */
input,
select {
  width: 100%;
  padding: 10px;
  border: 2px solid #b8d8cc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}
.avistamiento {
  background-color: white;
  max-width: 700px;
  margin: 25px auto;
  padding: 25px;

  border-radius: 15px;

  box-shadow:
    0 4px 15px rgba(0, 0, 0, 0.15);

  transition:
    transform 0.2s,
    box-shadow 0.2s;
}

.avistamiento:hover {
  transform: translateY(-4px);

  box-shadow:
    0 8px 20px rgba(0, 0, 0, 0.20);
}

.avistamiento h3 {
  display: block;
  width: fit-content;

  background-color: #2c5598;
  color: white;

  padding: 10px 18px;

  border-radius: 20px;

  margin-top: 0;

  cursor: pointer;
}

/* Cuando el usuario selecciona un campo */
input:focus,
select:focus {
  border-color: #1f4579;
  outline: none;
  box-shadow: 0 0 5px rgba(38, 108, 166, 0.4);
}


/* Botón */
button {
  width: 100%;
  margin-top: 25px;
  padding: 12px;

  background-color: #1f4579;
  color: #f3f7f9;

  border: none;
  border-radius: 8px;

  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#paginacion {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 30px 0;
}

#paginacion button {
  width: auto;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background-color: #d9e8e2;
  cursor: pointer;
  font-size: 16px;
}

#paginacion button:hover {
  background-color: #0f8eb5;
}

#paginacion button:disabled {
  background-color: #74b4be;
  color: white;
  cursor: default;
}


</style>
</head>

<body>

  <header>
    <nav>
      <a href="{{ url_for('intermedio') }}">
        ← Volver al menú
      </a>
    </nav>
  </header>


  <main>

    <h1>Avistamientos registrados</h1>

    <p class="descripcion">
      Consulta los avistamientos reportados por voluntarios.
    </p>


    <!-- ORDEN -->

    <section class="filtros">

      <h2>Ordenar avistamientos</h2>

      <label for="orden">
        Ordenar por:
      </label>

      <select id="orden">

        <option value="fecha_desc" selected>
          Fecha más reciente
        </option>

        <option value="fecha_asc">
          Fecha más antigua
        </option>

        <option value="lugar_asc">
          Lugar A-Z
        </option>

        <option value="lugar_desc">
          Lugar Z-A
        </option>

      </select>

    </section>


    <!-- LISTADO -->

    <section>

      <h2>Resultados</h2>

      <section id="lista-avistamientos">
        <!-- JavaScript agregará aquí los avistamientos -->
      </section>

    </section>


    <!-- PAGINACIÓN -->

    <nav
      id="paginacion"
      aria-label="Paginación de avistamientos"
    >
      <!-- JavaScript agregará los botones -->
    </nav>

  </main>


  <!-- Datos obtenidos desde Flask/MySQL -->

  <script id="datos-avistamientos" type="application/json">
  {{ avistamientos | tojson }}
  </script>

  <script>
    const avistamientos = JSON.parse(
      document.getElementById("datos-avistamientos").textContent
    );
  </script>


  <!-- JavaScript del listado -->

  <script
    src="{{ url_for('static', filename='js/listado.js') }}">
  </script>

</body>
</html>
